<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>煤矿瓦斯监测与通风联锁集控台</title>
<style>
body { font-family: "Microsoft YaHei", sans-serif; margin: 24px; background: #f4f6f8; }
h1 { font-size: 20px; }
.grid { display: flex; gap: 16px; flex-wrap: wrap; }
.card { background: #fff; border: 1px solid #d7dde3; border-radius: 6px; padding: 12px 16px; min-width: 160px; }
.card .label { color: #667; font-size: 12px; }
.card .value { font-size: 24px; font-weight: 600; }
table { border-collapse: collapse; margin-top: 16px; background: #fff; width: 100%; }
th, td { border: 1px solid #d7dde3; padding: 6px 10px; text-align: left; }
.alarm { color: #c0392b; font-weight: 600; }
.ok { color: #1e8449; }
</style>
</head>
<body>
<h1>煤矿井下瓦斯监测与通风联锁集控台</h1>
<div id="cards" class="grid"></div>
<table>
<thead><tr><th>测点</th><th>浓度</th><th>状态</th><th>区域</th><th>更新时间</th></tr></thead>
<tbody id="points"></tbody>
</table>
<script>
async function refresh() {
  const res = await fetch("/api/console/summary");
  const data = await res.json();
  const cards = [
    ["测点数", data.Points],
    ["超限闭锁", data.Tripped],
    ["报警", data.Alarms],
    ["风机运行", data.FansRunning],
    ["在线测点", data.Online],
    ["记录数", data.Records]
  ];
  document.getElementById("cards").innerHTML = cards.map(function (c) {
    return '<div class="card"><div class="label">' + c[0] + '</div><div class="value">' + c[1] + '</div></div>';
  }).join("");
  const rows = (data.PointDetails || []).map(function (p) {
    return '<tr><td>' + p.ID + '</td><td>' + p.Value.toFixed(2) + '</td><td>' + p.State + '</td><td>' + p.Zone + '</td><td>' + p.UpdatedAt + '</td></tr>';
  }).join("");
  document.getElementById("points").innerHTML = rows;
}
refresh();
setInterval(refresh, 3000);
</script>
</body>
</html>
